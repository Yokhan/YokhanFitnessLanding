/* ═══ DESIGN TOKENS ═══ */
const C = {
  bg:"#FAF8F4",card:"#FFF",bdr:"#E8E2D9",
  text:"#2C2824",mid:"#6E665C",muted:"#A49E94",light:"#C9C3B9",
  accent:"#A0522D",accentBg:"rgba(160,82,45,0.06)",
  green:"#4A7C59",greenBg:"rgba(74,124,89,0.06)",

const ff = {serif:"'Playfair Display',Georgia,serif",sans:"'Source Sans 3','Segoe UI',sans-serif",mono:"'DM Mono',monospace"};

/* ═══ ATOMS ═══ */
const Col=({gap=16,children,style})=><div style={{display:"flex",flexDirection:"column",gap,...style}}>{children}</div>;
const Grid=({children,min=260})=><div style={{display:"grid",gridTemplateColumns:`repeat(auto-fit,minmax(${min}px,1fr))`,gap:14}}>{children}</div>;
const Card=({children,style,onClick})=><div onClick={onClick} style={{background:C.card,border:`1px solid ${C.bdr}`,borderRadius:10,padding:20,overflow:"hidden",wordBreak:"break-word",...style}}>{children}</div>;
const Label=({children})=><div style={{fontFamily:ff.sans,fontSize:10.5,fontWeight:600,letterSpacing:1.8,textTransform:"uppercase",color:C.light,marginBottom:3}}>{children}</div>;
const P=({children,style})=><p style={{fontFamily:ff.sans,fontSize:14.5,lineHeight:1.75,color:C.mid,margin:0,overflowWrap:"break-word",...style}}>{children}</p>;
const H2=({children})=><h2 style={{fontFamily:ff.serif,fontSize:24,fontWeight:600,color:C.text,margin:"0 0 8px",lineHeight:1.2}}>{children}</h2>;
const H3=({children,style})=><h3 style={{fontFamily:ff.serif,fontSize:17,fontWeight:600,color:C.text,margin:0,overflowWrap:"break-word",...style}}>{children}</h3>;
const Pill=({active,onClick,children})=><button onClick={onClick} style={{padding:"7px 15px",borderRadius:20,cursor:"pointer",fontSize:13,fontFamily:ff.sans,fontWeight:500,transition:"all .2s",border:active?`1.5px solid ${C.accent}`:`1px solid ${C.bdr}`,background:active?C.accentBg:"transparent",color:active?C.accent:C.muted}}>{children}</button>;
const Metric=({label,value,sub,color})=><Card style={{borderLeft:`3px solid ${color}`}}><Label>{label}</Label><div style={{fontFamily:ff.serif,fontSize:22,fontWeight:700,color}}>{value}</div><div style={{fontSize:12,color:C.muted,marginTop:2,fontFamily:ff.sans}}>{sub}</div></Card>;
const Callout=({color,children})=><div style={{padding:"14px 18px",borderRadius:8,background:`${color}09`,border:`1px solid ${color}22`,fontFamily:ff.sans,fontSize:13.5,lineHeight:1.7,color}}>{children}</div>;
const Tag=({color,bg,children,nowrap=true})=><span style={{fontSize:11,fontWeight:600,color,background:bg,padding:"2px 8px",borderRadius:4,whiteSpace:nowrap?"nowrap":"normal"}}>{children}</span>;
const Num=({n})=><div style={{minWidth:30,height:30,borderRadius:6,background:C.accentBg,border:`1px solid ${C.accent}33`,display:"flex",alignItems:"center",justifyContent:"center",fontSize:12,fontWeight:700,color:C.accent,fontFamily:ff.mono,flexShrink:0}}>{String(n).padStart(2,"0")}</div>;

/* ═══ TABS ═══ */

/* ════════════════════════════════════════════
   TAB 1: DIAGNOSIS

    </div>
    <Grid>

      <Metric label="Эффективный чек" value="~1 300 ₽" sub="с учётом донатов и уступок" color={C.accent}/>
      <Metric label="Потенциал" value="12–20K ₽/день" sub="те же часы, но с системой" color={C.green}/>

      <Col gap={10}>
        {[
          {t:"Размытый прайсинг",imp:"–30–40% чека",d:"«Сколько не жалко» — антипаттерн. По Ариели, люди не умеют определять ценность в вакууме: нужен якорь. Без фиксированной цены якорь = ноль, клиент платит минимум, с которым не стыдно. Фиксированный пакет переносит ответственность за цену с клиента на структуру продукта."},
          {t:"Мёртвая зона 14:00–17:00",imp:"–2–3 клиента/день",d:"После обеда подходы прекращаются. Но 17–20 — golden hour: лучший свет, пары после пляжа, семьи после ужина. Самое маржинальное время пропускается. По Канеману, это истощение Системы 2 — решение не «собраться», а убрать нужду в волевом усилии через структуру дня."},
          {t:"Нулевой LTV клиента",imp:"–100% повторных",d:"Клиент уходит без следа. Зеленоградск — не Мальдивы: семьи возвращаются каждое лето, калининградцы приезжают на выходные. Без точки контакта повторная продажа невозможна. По Сьюэллу, клиент — актив с пожизненной стоимостью, а не одноразовая транзакция."},
          {t:"Плоский продукт",imp:"–500–1500 ₽/клиент",d:"Одна позиция — цифра на телефон. Нет печати (для 55+ это и есть «настоящее фото»), нет пакетов, нет премиума. По Хормози, ценность = результат × вероятность ÷ (время + усилие). Принтер увеличивает результат при нулевых усилиях клиента."},
        ].map((x,i)=><Card key={i}>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"baseline",marginBottom:6}}>

    </Callout>
  </Col>;
}

        {n:"Вероятность ↑",d:"Показать портфолио на камере после кандидного кадра = доказательство, что результат будет. Вероятность в глазах клиента → 95%. Без доказательства → 50/50."},

    </Col>,

      {[

    </Col>,
  };

  return <Col gap={24}>
    <div><H2>Восемь линз на одну ситуацию</H2><P>Каждый фреймворк — не теория, а способ увидеть конкретное действие, которое сейчас не делается. Синтез всех восьми даёт систему, а не набор «лайфхаков».</P></div>
    <div style={{display:"flex",gap:6,flexWrap:"wrap"}}>{fws.map(f=><Pill key={f.id} active={open===f.id} onClick={()=>setOpen(f.id)}>{f.label}</Pill>)}</div>
    <Card>{panels[open]}</Card>
  </Col>;
}

function Pose(){
  const [a,setA]=useState(0);
  const d=poseData[a];
  return <Col gap={20}>
    <div>
      <H2>Позинг: что говорить людям</H2>
      <P>Люди на променаде — не модели. Они не знают куда деть руки, зажимаются, стоят «по стойке смирно». Твоя работа — одной фразой расслабить и поставить. Не «примите S-образную позу» — а «обними его и смотри на море». Ниже — конкретные команды, которые ты произносишь вслух.</P>
    </div>
    <Callout color={C.amber}><strong>Три правила полевого позинга:</strong><br/>1. Одна фраза = одна поза. Если объясняешь дольше 10 секунд — упрости.<br/>2. Движение лучше статики. «Идите ко мне» побеждает «встаньте вот так» в 9 из 10 случаев.<br/>3. Дай людям что-то ДЕЛАТЬ: держаться за руки, обниматься, идти, смотреть друг на друга. Когда заняты действием — забывают про камеру.</Callout>

    <div style={{display:"flex",gap:5,flexWrap:"wrap"}}>
      {poseData.map((x,i)=><Pill key={i} active={a===i} onClick={()=>setA(i)}><span style={{marginRight:3}}>{x.icon}</span><span style={{fontSize:11.5}}>{x.arch}</span></Pill>)}
    </div>

    <Card style={{padding:24}}>
      <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:12}}>
        <span style={{fontSize:28}}>{d.icon}</span>
        <H3 style={{fontSize:19}}>{d.arch}</H3>
        <Tag color={C.muted} bg={C.bg}>{d.poses.length} поз</Tag>
      </div>
      <PoseSVG type={d.svg}/>
      <Col gap={8} style={{marginTop:14}}>
        {d.poses.map((p,i)=><div key={i} style={{background:C.bg,borderRadius:8,padding:"12px 16px"}}>
          <div style={{display:"flex",gap:8,alignItems:"baseline",marginBottom:6}}>
            <Num n={i+1}/>
            <H3 style={{fontSize:14.5}}>{p.name}</H3>
          </div>
          <div style={{background:C.greenBg,border:`1px solid ${C.green}22`,borderRadius:6,padding:"8px 12px",marginBottom:6}}>
            <div style={{fontSize:10,fontWeight:600,letterSpacing:1.2,textTransform:"uppercase",color:C.green,marginBottom:2}}>Что говоришь вслух</div>
            <P style={{fontSize:13.5,color:C.green,fontWeight:500}}>{p.cmd}</P>
          </div>
          <P style={{fontSize:12.5,color:C.muted}}>{p.note}</P>
        </div>)}
      </Col>
    </Card>

    <Card style={{background:C.amberBg,border:`1px solid ${C.amber}33`}}>
      <H3 style={{color:C.amber,marginBottom:8}}>Если человек зажат и ничего не помогает</H3>
      <Col gap={6}>
        {[
          "«Перенеси вес на одну ногу» — мгновенно убирает стойку солдата",
          "«Сделай шаг вперёд» — тело расслабляется автоматически",
          "«Посмотрите друг на друга» — появляется живая эмоция",
          "«Расскажите мне что-нибудь смешное!» — настоящая улыбка вместо натянутой",
          "«Закройте глаза, вдохните, откройте — и улыбнитесь» — сброс напряжения",
          "«Попрыгайте на месте 3 раза» — ломает зажатость через абсурд, все смеются",
          "«Представьте, что вам сказали, что вы выиграли миллион» — глаза загораются",
          "«Обнимитесь по-настоящему, как будто давно не виделись» — из формального в тёплое",
        ].map((t,i)=><P key={i} style={{fontSize:13,color:C.amber}}>→ {t}</P>)}
      </Col>
    </Card>
  </Col>;
}

function Psych(){
  const cats=["Страх подхода","Самооценка","Деньги","Отказы","Энергия","Продажа","Рост"];
  const [cat,setCat]=useState("all");
  const filtered=cat==="all"?beliefs:beliefs.filter(b=>b.cat===cat);
  const [expanded,setExpanded]=useState(null);

  return <Col gap={20}>
    <div><H2>Психология фотографа: 20 убеждений, которые стоят денег</H2>
      <P>Самый частый потолок — не техника, не локация, не трафик. Это то, что происходит в голове в момент между «вижу клиента» и «подхожу». Каждое убеждение ниже имеет конкретную цену в рублях. Осознание → переосмысление → практика.</P>
    </div>
    <div style={{display:"flex",gap:5,flexWrap:"wrap"}}>
      <Pill active={cat==="all"} onClick={()=>setCat("all")}>Все ({beliefs.length})</Pill>
      {cats.map(c=>{const cnt=beliefs.filter(b=>b.cat===c).length; return <Pill key={c} active={cat===c} onClick={()=>setCat(c)}>{c} ({cnt})</Pill>})}
    </div>
    <Col gap={8}>
      {filtered.map((b,i)=>{
        const isOpen=expanded===b.belief;
        return <Card key={i} style={{cursor:"pointer",transition:"all .2s",border:isOpen?`1.5px solid ${C.accent}`:`1px solid ${C.bdr}`}} onClick={()=>setExpanded(isOpen?null:b.belief)}>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",gap:10}}>
            <div style={{flex:1,minWidth:0}}>
              <div style={{display:"flex",gap:8,alignItems:"center",marginBottom:4,flexWrap:"wrap"}}>
                <Tag color={C.blue} bg={C.blueBg}>{b.cat}</Tag>
                <Tag color={C.accent} bg={C.accentBg} nowrap={false}>{b.cost}</Tag>
              </div>
              <H3 style={{fontSize:15,lineHeight:1.4}}>{b.belief}</H3>
            </div>
            <span style={{fontSize:18,color:C.light,flexShrink:0,transform:isOpen?"rotate(180deg)":"rotate(0deg)",transition:"transform .2s"}}>▾</span>
          </div>
          {isOpen && <div style={{marginTop:14}}>
            <div style={{marginBottom:12}}>
              <div style={{fontSize:10,fontWeight:600,letterSpacing:1.5,textTransform:"uppercase",color:C.accent,marginBottom:3}}>Почему это стоит денег</div>
              <P style={{fontSize:13.5}}>{b.why}</P>
            </div>
            <div style={{marginBottom:12,background:C.greenBg,border:`1px solid ${C.green}22`,borderRadius:8,padding:"10px 14px"}}>
              <div style={{fontSize:10,fontWeight:600,letterSpacing:1.5,textTransform:"uppercase",color:C.green,marginBottom:3}}>Переосмысление</div>
              <P style={{fontSize:13.5,color:C.green,fontWeight:500}}>{b.reframe}</P>
            </div>
            <div style={{background:C.blueBg,border:`1px solid ${C.blue}22`,borderRadius:8,padding:"10px 14px"}}>
              <div style={{fontSize:10,fontWeight:600,letterSpacing:1.5,textTransform:"uppercase",color:C.blue,marginBottom:3}}>Практическая техника</div>
              <P style={{fontSize:13.5,color:C.blue}}>{b.technique}</P>
            </div>
          </div>}
        </Card>;
      })}
    </Col>
    <Callout color={C.green}><strong>Главный инсайт:</strong> Все 20 убеждений — варианты одного: «Я недостаточно ценна, чтобы просить деньги за свою работу». Это неправда. Ты решаешь реальную проблему реальных людей. Они не могут сделать то, что делаешь ты. И они готовы за это заплатить — если ты дашь им возможность.</Callout>
  </Col>;
}
function Calc(){
  const [cl,setCl]=useState(5);
  const [ch,setCh]=useState(3000);
  const [dy,setDy]=useState(25);
  const [pr,setPr]=useState(40);
  const base=cl*ch*dy;
  const print=cl*dy*(pr/100)*500;
  const total=base+print;
  const exp=3000+cl*dy*(pr/100)*25+2000;
  const net=total-exp;

  const Slider=({label,value,onChange,min,max,step=1,unit=""})=>(
    <Card><div style={{display:"flex",justifyContent:"space-between",marginBottom:6}}><span style={{fontSize:13,color:C.muted}}>{label}</span><span style={{fontFamily:ff.serif,fontSize:18,fontWeight:700,color:C.text}}>{value}{unit}</span></div>
    <input type="range" min={min} max={max} step={step} value={value} onChange={e=>onChange(+e.target.value)} style={{width:"100%",accentColor:C.accent}}/>
    <div style={{display:"flex",justifyContent:"space-between",fontSize:10.5,color:C.light}}><span>{min}{unit}</span><span>{max}{unit}</span></div></Card>
  );

  return <Col gap={24}>
    <div><H2>Калькулятор дохода</H2><P>Интерактивная модель: двигай ползунки, чтобы увидеть, как каждый параметр влияет на итог. Расходы включают расходники печати, визитки и налог самозанятого (6%).</P></div>
    <Grid>
      <Slider label="Клиентов в день" value={cl} onChange={setCl} min={2} max={10}/>
      <Slider label="Средний чек" value={ch} onChange={setCh} min={1500} max={6000} step={500} unit=" ₽"/>
      <Slider label="Рабочих дней/мес" value={dy} onChange={setDy} min={15} max={30}/>
      <Slider label="% берут печать" value={pr} onChange={setPr} min={0} max={80} step={10} unit="%"/>
    </Grid>
    <Grid>
      <Metric label="Выручка съёмка" value={`${(base/1000).toFixed(0)}K ₽`} sub="в месяц" color={C.blue}/>
      <Metric label="Доход печать" value={`${(print/1000).toFixed(0)}K ₽`} sub="в месяц" color={C.amber}/>
      <Metric label="Расходы" value={`${(exp/1000).toFixed(0)}K ₽`} sub="расходники + налоги + визитки" color={C.accent}/>
      <Metric label="Чистый доход" value={`${(net/1000).toFixed(0)}K ₽`} sub="на руки" color={C.green}/>
    </Grid>
    <Card style={{textAlign:"center",padding:28}}>
      <div style={{fontSize:13,color:C.muted,marginBottom:6}}>В пересчёте на день</div>
      <div style={{fontFamily:ff.serif,fontSize:36,fontWeight:700,color:C.text}}>{(net/dy/1000).toFixed(1)}K ₽/день</div>
      <div style={{fontSize:13,color:C.muted,marginTop:4}}>vs. текущие 4–8K → рост в <strong style={{color:C.green}}>{(net/dy/6000).toFixed(1)}×</strong></div>
    </Card>
    <Card style={{textAlign:"center",background:C.greenBg,border:`1px solid ${C.green}33`}}>
      <div style={{fontSize:14,color:C.green}}>
        <strong>За сезон (5 мес):</strong> ≈ {(net*5/1000).toFixed(0)}K ₽ чистыми
      </div>
    </Card>
  </Col>;
}
